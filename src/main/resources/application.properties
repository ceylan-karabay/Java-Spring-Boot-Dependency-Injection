server.port=8585
# Tüm endpointlerin ön eki
server.servlet.context-path=/workintech
spring.devtools.restart.enabled=true
# Actuator endpointlerini eri?ime aç
management.endpoints.web.exposure.include=info,health,mappings

# Health endpointinde ayr?nt?lar? göster
management.endpoint.health.show-details=always

# Info endpointini etkinle?tir
management.info.env.enabled=true

# Uygulama bilgileri
info.app.name=Developer Management API
info.app.description=Workintech Developer Management Project
info.app.version=1.0.0